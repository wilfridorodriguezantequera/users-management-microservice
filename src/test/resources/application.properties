# =============================================
# Test configuration (fictitious values only)
# =============================================

# Evita levantar contexto web en tests Mockito puros (@ExtendWith(MockitoExtension.class))
spring.main.web-application-type=none
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

db.host=localhost
db.port=3306
db.name=test_db
db.username=test_user
db.password=test_pass

# =============================================
# Kafka y accounts (valores ficticios)
# =============================================
kafka.bootstrap-servers=localhost:9092
kafka.topic=notificaciones
kafka.security-protocol=PLAINTEXT
kafka.sasl.mechanism=SCRAM-SHA-256
kafka.username=
kafka.password=
kafka.ca-cert=
kafka.send-timeout=1s
accounts.base-url=http://localhost:8081
accounts.timeout.connect=100ms
accounts.timeout.read=100ms
accounts.retry.max-attempts=3
accounts.retry.initial-delay=1ms
accounts.retry.multiplier=1.0
accounts.circuit-breaker.failure-rate-threshold=50
accounts.circuit-breaker.sliding-window-size=10
accounts.circuit-breaker.minimum-calls=5
accounts.circuit-breaker.open-duration=1s

jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtd2l0aC1hdC1sZWFzdC0zMi1ieXRlcw==
jwt.expiration-seconds=900
