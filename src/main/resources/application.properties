# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}
spring.config.import=optional:file:./.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Kafka (Aiven) — paso 2: users publica los correos en el topico
# 'notificaciones' y el microservicio notifiers los envia con Brevo.
# En Aiven: KAFKA_SECURITY_PROTOCOL=SASL_SSL y KAFKA_SASL_MECHANISM=SCRAM-SHA-256.
# KAFKA_CA_CERT es el contenido del archivo ca.pem descargado de Aiven.
# =============================================
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic=${KAFKA_TOPIC:notificaciones}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.username=${KAFKA_USERNAME:}
kafka.password=${KAFKA_PASSWORD:}
kafka.ca-cert=${KAFKA_CA_CERT:}
kafka.send-timeout=${KAFKA_SEND_TIMEOUT:30s}

# =============================================
# Microservicio accounts — paso 5: POST {ACCOUNTS_URL}/api/accounts
# El read timeout es largo porque Render (plan gratis) tarda en despertar el servicio.
# =============================================
accounts.base-url=${ACCOUNTS_URL:http://localhost:8081}
accounts.timeout.connect=${ACCOUNTS_CONNECT_TIMEOUT:10s}
accounts.timeout.read=${ACCOUNTS_READ_TIMEOUT:70s}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
